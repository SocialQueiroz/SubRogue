<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Into Hadal Deep</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{--ink:#f4ead2;--dim:#9fb0b4;--gold:#ffd45e;--hp:#ff5d6c;--o2:#59d8ff;--xp:#9dff8a;--acc:#ffb347;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#02101a;color:var(--ink);font-family:VT323,ui-monospace,Menlo,monospace;font-size:21px;line-height:1.05;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;cursor:crosshair}
img{image-rendering:pixelated;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* ---------- HUD ---------- */
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:2px 2px 0 #000}
.bars{display:flex;flex-direction:column;gap:6px;width:min(190px,44vw)}
.bar{position:relative;height:15px;border:2px solid #000;background:#000a;box-shadow:0 0 0 2px #2c4f5a}
.bar i{position:absolute;inset:0;width:50%;transition:width .15s}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:7px "Press Start 2P"}
#hpb i{background:linear-gradient(#ff8a94,var(--hp))}#o2b i{background:linear-gradient(#a8ecff,var(--o2))}#batb{height:11px}#batb i{background:linear-gradient(#fff2a0,#e8c040)}#xpb{height:9px}#xpb i{background:var(--xp)}
#st{font-size:18px;color:#cfe0e4}#cardn{font-size:17px;color:#ffd9a0;display:flex;gap:5px;align-items:center}#cardn img{width:14px;height:14px}
#info{text-align:right;font-size:19px;line-height:.95}#zone{color:var(--acc)}#mod{color:#c9a0ff;font-size:17px}#depth{font:12px "Press Start 2P";margin:4px 0}#nb{font-size:17px;color:#ff9ab0}
#gold{color:var(--gold);display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:22px}#gold img{width:18px;height:18px}
#mm{display:block;margin:8px 0 0 auto;width:min(128px,26vw);image-rendering:pixelated;border:2px solid #000;box-shadow:0 0 0 2px #2c4f5a;background:#000a}#mm.off{display:none}
#abil{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:6px;pointer-events:none}
.ab{position:relative;width:48px;height:48px;border:3px solid #000;background:#0c181ecc;box-shadow:inset 0 0 0 2px #2c4f5a;display:flex;align-items:center;justify-content:center}
.ab img{width:32px;height:32px}.ab i{position:absolute;left:2px;right:2px;top:2px;height:0;background:#000c}
.ab u,.ab s{position:absolute;font:7px "Press Start 2P";text-decoration:none;text-shadow:1px 1px 0 #000}.ab u{right:3px;bottom:3px;color:#cfe0e4}.ab s{left:4px;top:4px;color:var(--gold)}
#combo{position:fixed;top:30%;right:max(14px,env(safe-area-inset-right));font:16px "Press Start 2P";color:var(--gold);text-shadow:0 3px 0 #000;pointer-events:none;text-align:right}
#combo small{display:block;font:20px VT323;color:var(--ink);margin-top:2px}#combo i{display:block;height:3px;background:var(--gold);margin:4px 0 0 auto}
#bossbar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(420px,70vw);text-align:center;font-size:24px;color:#ff9ab0;pointer-events:none;text-shadow:2px 2px 0 #000}
#bossbar .bar{margin-top:4px;box-shadow:0 0 0 2px #7a2040}#bossbar .bar.ph4::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent calc(25% - 1px),#000 0 calc(25% + 1px),transparent 0 calc(50% - 1px),#000 0 calc(50% + 1px),transparent 0 calc(75% - 1px),#000 0 calc(75% + 1px),transparent 0)}#bossbar i{background:linear-gradient(#ff7aa0,#c81e4a)}
#banner{position:fixed;top:22%;left:0;right:0;text-align:center;font-size:clamp(34px,6vw,60px);letter-spacing:2px;color:var(--acc);text-shadow:3px 3px 0 #000,0 0 18px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#bossintro{position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0;transform:scale(1.3);transition:opacity .4s,transform .5s}#bossintro.on{opacity:1;transform:scale(1)}
#bossintro b{display:block;font:clamp(22px,5vw,46px) "Press Start 2P";color:#fff;text-shadow:0 4px 0 #a0102a,0 8px 0 #000,0 0 30px #ff3a5a}#bossintro i{display:block;font-style:normal;font-size:30px;color:#ffb0c0;margin-top:10px;text-shadow:2px 2px 0 #000}#bossintro small{display:block;font-size:22px;color:#7fe9ff;margin-bottom:8px;letter-spacing:4px;text-shadow:2px 2px 0 #000}
#banner small{display:block;font-size:.45em;color:var(--ink);margin-top:2px;letter-spacing:1px}
#hint{position:fixed;left:50%;bottom:15%;transform:translateX(-50%);width:min(500px,90vw);display:flex;gap:10px;align-items:center;background:#0c181ef0;border:3px solid #000;box-shadow:inset 0 0 0 2px #2c4f5a,0 4px 0 #0008;padding:6px 12px 6px 6px;opacity:0;transition:opacity .4s;pointer-events:none}
#hint img{width:48px;height:48px;border:2px solid #000;background:#3a6a7a;flex:none}#hint b{display:block;font-size:17px;color:var(--gold);margin-bottom:1px;letter-spacing:1px}
#pbtn{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 78px);left:max(12px,env(safe-area-inset-left));display:none;width:38px;height:38px;font:9px "Press Start 2P";background:#0c181ecc;border:3px solid #000;box-shadow:inset 0 0 0 2px #2c4f5a}
#tb{position:fixed;right:max(12px,env(safe-area-inset-right));top:36%;display:none;flex-direction:column;gap:8px}
#tb button{width:58px;height:58px;border:3px solid #000;background:#0c181ecc;box-shadow:inset 0 0 0 2px #2c4f5a;display:flex;align-items:center;justify-content:center;position:relative}
#tb img{width:34px;height:34px}#tb s{position:absolute;left:4px;top:3px;font:7px "Press Start 2P";color:var(--gold);text-decoration:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
/* ---------- painéis ---------- */
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;padding:14px;overflow:auto}
.metal,.wood{position:relative;border:4px solid #000;padding:22px 24px;width:100%;margin:auto;box-shadow:0 10px 0 #0009}
.metal{max-width:620px;background:radial-gradient(circle at 10px 10px,#9cc4cc 2px,#1c343c 3px,transparent 4px),radial-gradient(circle at calc(100% - 10px) 10px,#9cc4cc 2px,#1c343c 3px,transparent 4px),radial-gradient(circle at 10px calc(100% - 10px),#9cc4cc 2px,#1c343c 3px,transparent 4px),radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#9cc4cc 2px,#1c343c 3px,transparent 4px),repeating-linear-gradient(#17303a 0 3px,#142a33 3px 6px);box-shadow:inset 0 0 0 3px #3b6470,inset 0 0 0 6px #0c181e,0 10px 0 #0009}
.wood{max-width:820px;background:radial-gradient(circle at 10px 10px,#e8c070 2px,#3a2010 3px,transparent 4px),radial-gradient(circle at calc(100% - 10px) 10px,#e8c070 2px,#3a2010 3px,transparent 4px),radial-gradient(circle at 10px calc(100% - 10px),#e8c070 2px,#3a2010 3px,transparent 4px),radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#e8c070 2px,#3a2010 3px,transparent 4px),repeating-linear-gradient(#4a2c18 0 26px,#3a2010 26px 28px,#53321c 28px 54px,#3a2010 54px 56px);box-shadow:inset 0 0 0 3px #8a5a30,inset 0 0 0 6px #2a160a,0 10px 0 #0009}
h2{font-size:44px;font-weight:400;margin:0 0 4px;color:#ffe2a0;text-shadow:3px 3px 0 #000;letter-spacing:1px}
.say{font-size:22px;color:#cfe0e4;margin:0 0 12px}
.btn{font:10px "Press Start 2P";color:#2a1a0a;background:#e8c890;border:3px solid #000;box-shadow:inset -3px -3px 0 #b08850,inset 3px 3px 0 #fff3d0;padding:11px 14px}
.btn.sel,.btn:hover{background:#ffe0a0}.btn:active{box-shadow:inset 3px 3px 0 #b08850}
.bot{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
/* menus em lista */
.menu{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.mi{font-size:32px;color:#8fa9b0;padding:2px 10px 2px 30px;position:relative;text-shadow:2px 2px 0 #000;text-align:left;white-space:nowrap}
.mi.sel{color:#fff2c4}
.mi.sel:before{content:'';position:absolute;left:6px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:10px solid var(--gold);animation:nudge .5s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
/* título */
#title{background:linear-gradient(#01101c10,#01101cb0);flex-direction:column}
.logo{font:clamp(30px,8.5vw,70px) "Press Start 2P";color:#7fe9ff;text-shadow:0 4px 0 #1b5f7a,0 8px 0 #0b2a3a,0 12px 0 #000;margin:0 0 18px;display:flex;justify-content:center}
.logo span{display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.sub{font-size:26px;color:#ffd9a0;text-shadow:2px 2px 0 #000;text-align:center;margin-bottom:30px}
.foot{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:22px;color:#cfe0e4;text-shadow:2px 2px 0 #000;pointer-events:none}
.foot span{display:flex;align-items:center;gap:6px}.foot img{width:20px;height:20px}
/* loja e estaleiro */
.keeper{display:flex;gap:16px;align-items:stretch;margin-bottom:8px}
.face{width:96px;height:96px;border:3px solid #000;background:#3a6a7a;box-shadow:inset 0 0 0 2px #8a5a30;flex:none}
.bubble{flex:1;position:relative;background:#f4ead2;color:#2a1a0a;border:3px solid #000;padding:8px 12px;min-height:96px;font-size:22px;line-height:1}
.bubble:before{content:'';position:absolute;left:-15px;top:30px;border:7px solid transparent;border-right:10px solid #000}
.bubble b{display:block;font-size:26px;margin-bottom:2px}.bubble em{font-style:normal;color:#7a5a2a}.bubble .hint{display:block;margin-top:6px;color:#8a6a40;font-size:18px}
.bubble .r1{color:#1d6fa0}.bubble .r2{color:#7a3fb0}
.lbl{font-size:22px;color:#f0d8a8;text-shadow:2px 2px 0 #000;margin:10px 0 2px 4px}
.shelf{display:flex;flex-wrap:wrap;gap:8px;padding:6px 6px 10px;border-bottom:7px solid #6b4020;box-shadow:0 4px 0 #1e0f05}
.slot{position:relative;width:70px;height:82px;background:#24160c;border:3px solid #000;box-shadow:inset 0 0 0 2px #5a3a20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.slot img{width:44px;height:44px}
.slot .pr{font-size:20px;color:var(--gold);display:flex;align-items:center;gap:3px}.slot .pr img{width:14px;height:14px}
.slot.sel{box-shadow:inset 0 0 0 2px var(--gold);background:#3a2410}
.slot.no .pr{color:#c86060}.slot.done{opacity:.35}.slot.done .pr{color:#aaa}
.slot.r1{box-shadow:inset 0 0 0 2px #59d8ff}.slot.r2{box-shadow:inset 0 0 0 2px #d38cff}.slot.r1.sel,.slot.r2.sel{background:#3a2410;outline:2px solid var(--gold)}
.slot .tag{position:absolute;top:-9px;right:-10px;background:#d62f3a;color:#fff;font-size:17px;padding:0 4px;border:2px solid #000;transform:rotate(9deg)}
.dots{display:flex;gap:2px;position:absolute;top:5px;left:6px}.dots i{width:4px;height:4px;background:#4a3020}.dots i.on{background:var(--xp)}
.purse{margin-right:auto;display:flex;align-items:center;gap:6px;font-size:30px;color:var(--gold);text-shadow:2px 2px 0 #000}.purse img{width:26px;height:26px}.purse small{font-size:20px;color:#cfe0b0}
.slot.ok{animation:ok .35s steps(3)}@keyframes ok{50%{transform:translateY(-7px)}}.shake{animation:sh .3s steps(4)}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* cartas */
.tcard{position:relative;width:180px;height:256px;border:4px solid #000;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--c1) 35%,transparent),transparent 65%),linear-gradient(var(--c2),#04070b);box-shadow:inset 0 0 0 3px var(--fr),inset 0 0 0 6px #000,0 8px 0 #0008;display:flex;flex-direction:column;align-items:center;padding:30px 12px 10px;text-align:center;color:var(--ink)}
.tcard .no{position:absolute;top:10px;left:12px;font:7px "Press Start 2P";color:var(--fr)}.tcard .ra{position:absolute;top:8px;right:12px;font-size:16px;color:var(--fr)}
.tcard .art{width:104px;height:92px;border:3px solid #000;box-shadow:inset 0 0 0 2px var(--fr);background:radial-gradient(var(--c1),color-mix(in srgb,var(--c1) 20%,#000) 75%);display:flex;align-items:center;justify-content:center;flex:none}
.tcard .art img{width:64px;height:64px;filter:drop-shadow(2px 2px 0 #0008)}
.tcard .nm{font-size:23px;color:#fff2c4;margin-top:10px;text-shadow:2px 2px 0 #000}.tcard .ds{font-size:17px;color:#d8e0e4;margin-top:4px;line-height:.95}
.tcard .ct{position:absolute;bottom:7px;left:0;right:0;font:6px "Press Start 2P";color:var(--c1);letter-spacing:2px}
.tcard.r2{box-shadow:inset 0 0 0 3px var(--fr),inset 0 0 0 6px #000,0 0 18px #ffd45e88,0 8px 0 #0008}
.tcard.r3{box-shadow:inset 0 0 0 3px var(--fr),inset 0 0 0 6px #000,0 0 26px #ff8ad8aa,0 8px 0 #0008;animation:prism 3s linear infinite}
@keyframes prism{to{filter:hue-rotate(360deg)}}
.tcard.back{--c1:#59d8ff;--c2:#06182a;--fr:#c8a24a;background:repeating-linear-gradient(45deg,#0b2236 0 8px,#09192a 8px 16px);justify-content:center}
.tcard.back .art{border-radius:50%;width:96px;height:96px}
.hand{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:24px 0 14px;perspective:900px}
.flip{position:relative;width:180px;height:256px;transition:transform .35s,opacity .35s}.flip .inner{position:absolute;inset:0;transition:transform .6s;transform-style:preserve-3d}
.flip{display:block;padding:0}.flip .inner,.flip .face{left:0;top:0;width:100%;height:100%}.flip .face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}.flip .tcard{box-shadow:inset 0 0 0 3px var(--fr),inset 0 0 0 6px #000}.flip .tcard.r2{box-shadow:inset 0 0 0 3px var(--fr),inset 0 0 0 6px #000,0 0 18px #ffd45e88}.flip .tcard.r3{box-shadow:inset 0 0 0 3px var(--fr),inset 0 0 0 6px #000,0 0 26px #ff8ad8aa}.flip .ff{transform:rotateY(180deg)}.flip.on .inner{transform:rotateY(180deg)}.flip.on .fb{visibility:hidden;transition:visibility 0s .3s}
.flip.on.sel{transform:translateY(-8px)}.flip.gone{opacity:.15;transform:scale(.92)}.flip.chosen{transform:translateY(-6px) scale(1.04)}
.newc{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-6deg);background:#3fd08a;color:#000;font:8px "Press Start 2P";padding:4px 6px;border:2px solid #000}
.mini-hold{transform:scale(.72);transform-origin:top left;width:130px;height:186px;margin-bottom:6px}
.albw{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.alb{flex:1;min-width:260px;display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:52vh;overflow:auto;padding:4px}
.mini{height:46px;border:2px solid #000;background:linear-gradient(var(--c2),#04070b);box-shadow:inset 0 0 0 2px var(--fr);display:flex;align-items:center;justify-content:center;cursor:pointer}.mini.sel{outline:2px solid var(--gold)}
.mini.un{background:repeating-linear-gradient(45deg,#0b2236 0 4px,#09192a 4px 8px);box-shadow:inset 0 0 0 2px #2c4f5a;cursor:default}.mini u{text-decoration:none;color:#3b6470;font-size:20px}
.albp{width:190px;min-height:260px;flex:none}
@media(max-width:560px){.albp{width:100%;display:flex;justify-content:center}.flip,.tcard{width:150px;height:226px}.tcard .art{width:86px;height:76px}.tcard .art img{width:52px;height:52px}.tcard .nm{font-size:20px}.tcard .ds{font-size:15px}}

/* carta roguelike */
.rc2{position:relative;width:180px;height:256px;padding:7px 9px 9px;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,var(--f1),var(--f2));border:3px solid #000;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);text-align:center;color:#2a1a0a}
.rc2.cback{background:linear-gradient(160deg,#1d3f6a,#06182a);justify-content:center}.cb-in{width:100%;height:100%;border:2px solid #c8a24a;background:repeating-linear-gradient(45deg,#0b2236 0 8px,#09192a 8px 16px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.cb-in b{font:7px "Press Start 2P";color:#c8a24a;letter-spacing:2px}.cb-in img{filter:drop-shadow(0 0 8px #3ac8ff)}
.rc2:before{content:'';position:absolute;inset:3px;border:2px solid rgba(255,255,255,.35);clip-path:inherit;pointer-events:none}
.rc2 .ttl{position:relative;z-index:1;margin-top:8px;width:100%;padding:4px 6px 5px;background:linear-gradient(#f4e6c4,#d8c090);border:2px solid #000;font-size:20px;line-height:.9;color:#2a1a0a;clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,6px 100%,0 50%);text-shadow:none}
.rc2 .art{position:relative;width:132px;height:84px;margin-top:5px;border:3px solid #000;border-radius:60px 60px 4px 4px/40px 40px 4px 4px;background:radial-gradient(circle at 50% 60%,var(--c1),var(--c2) 80%);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -6px 0 #0004}
.rc2 .art img{position:relative;width:60px;height:60px;filter:drop-shadow(0 3px 0 #0008) drop-shadow(0 0 6px var(--c1))}
.rc2 .rays{position:absolute;inset:-40px;background:repeating-conic-gradient(from 0deg,#fff2 0 8deg,transparent 8deg 22deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rc2 .typ{margin-top:4px;padding:0 8px;background:#1a1410;border:2px solid #000;font-size:15px;line-height:1.1;color:var(--c1);letter-spacing:1px}
.rc2 .txt{flex:1;width:100%;margin-top:4px;padding:5px 7px;background:#efe2c4;border:2px solid #000;box-shadow:inset 0 0 0 2px #d8c49a;font-size:17px;line-height:.95;color:#3a2410;display:flex;align-items:center;justify-content:center}
.rc2 .gem{position:absolute;top:2px;left:50%;transform:translateX(-50%);display:flex;gap:2px;z-index:2}.rc2 .gem i{width:7px;height:7px;background:var(--f1);border:1px solid #000;transform:rotate(45deg)}
.rc2 .no{position:absolute;top:5px;left:12px;font:6px "Press Start 2P";color:#000a;z-index:2}
.rc2.r2{filter:drop-shadow(0 0 8px #ffd45e88)}.rc2.r3{filter:drop-shadow(0 0 10px #ff8ad8aa);animation:prism 4s linear infinite}
.rc2.r3 .ttl{background:linear-gradient(90deg,#ffe0f4,#e0f8ff,#fff4c0,#ffe0f4)}
/* loja nova */
.peds{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.ped{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 8px;border:3px solid transparent;background:#1e120899}
.ped.sel{border-color:var(--gold);background:#3a24109a}.ped .plb{font-size:20px;color:#f0d8a8;text-shadow:2px 2px 0 #000}
.ped .price{display:flex;align-items:center;gap:4px;font-size:24px;color:var(--gold);background:#1a1008;border:2px solid #000;padding:0 10px;text-shadow:2px 2px 0 #000}.ped .price img{width:16px;height:16px}
.ped.no .price{color:#ff7a6a}.ped.sold .rc2{filter:grayscale(1) brightness(.5)}.ped.sold .price{color:#aaa}.ped kbd{margin-top:4px}
.invr{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px;font-size:19px;color:#f0d8a8}.invr i{width:28px;height:28px;background:#1a1008;border:2px solid #000;display:flex;align-items:center;justify-content:center}.invr i.rl{box-shadow:inset 0 0 0 2px #ffd45e}.invr img{width:22px;height:22px}
canvas.face{width:96px;height:96px;image-rendering:pixelated;border:3px solid #000;background:radial-gradient(#5a9ab0,#2a5a6a);box-shadow:inset 0 0 0 2px #8a5a30;flex:none}canvas.face.big{width:120px;height:120px}
#hint canvas.rface{width:52px;height:52px;image-rendering:pixelated;border:2px solid #000;background:radial-gradient(#5a9ab0,#2a5a6a);flex:none}#hint .rb b{display:block;font-size:17px;color:var(--gold);margin-bottom:1px;letter-spacing:1px}

.logo em{font:clamp(14px,3vw,24px) "Press Start 2P";font-style:normal;color:#ffe0a0;letter-spacing:10px;text-shadow:0 3px 0 #6a2a1a,0 6px 0 #000;margin-bottom:22px;padding-top:6px}
.logo .l2{display:flex;font:clamp(28px,7.5vw,68px) "Press Start 2P";color:#bff4ff;text-shadow:0 2px 0 #7fe9ff,0 4px 0 #3ab0e0,0 6px 0 #1a7ab0,0 8px 0 #0a3a6a,0 11px 0 #04182a,0 14px 0 #000,0 0 22px #3ac8ff88}

.sub{font-size:28px;color:#ffe0c0;text-shadow:2px 2px 0 #000,0 0 12px #000}

textarea#pcode{width:100%;height:70px;margin-top:8px;background:#08121a;color:#9fe8ff;border:2px solid #000;box-shadow:inset 0 0 0 2px #2c4f5a;font:16px VT323,monospace;resize:none;padding:6px}
/* subir de nível */
.boon{display:flex;gap:14px;align-items:center;padding:8px;border:3px solid transparent;margin:6px 0;background:#0c181e99;cursor:pointer;text-align:left;width:100%}
.boon.sel{border-color:var(--gold);background:#1e3c46}
.boon .ic{width:58px;height:58px;flex:none;background:#08121a;border:3px solid #000;box-shadow:inset 0 0 0 2px #3b6470;display:flex;align-items:center;justify-content:center}
.boon.r1 .ic{box-shadow:inset 0 0 0 2px #59d8ff}.boon.r2 .ic{box-shadow:inset 0 0 0 2px #d38cff,0 0 12px #d38cff99}
.boon .nm{font-size:27px;color:#fff2c4}.boon.r1 .nm{color:#8fe8ff}.boon.r2 .nm{color:#e6b0ff}
.boon .ds{font-size:20px;color:var(--dim)}.boon .lv{color:var(--xp);font-size:18px}
kbd{font:9px "Press Start 2P";display:inline-block;min-width:24px;padding:5px 5px 8px;background:#d8d0bc;color:#222;border:2px solid #000;box-shadow:inset 0 -4px 0 #8a826e;text-align:center}
.boon kbd{margin-left:auto;flex:none}

.gates{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.gate{width:170px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 6px;border:3px solid transparent;cursor:pointer}
.gate.sel{border-color:var(--gold);background:#1e3c46}
.arch{width:104px;height:110px;border-radius:52px 52px 0 0;background:radial-gradient(ellipse at 50% 80%,#000 40%,#0a1820 75%);border:7px solid #4a3a30;border-bottom:0;box-shadow:inset 0 0 0 3px #000,0 0 0 3px #000;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.arch img{width:48px;height:48px}
.gate .nm{font-size:26px;color:#fff2c4}.gate .dd{font-size:18px;color:#7fe9ff}.tags{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px;align-items:center}.tg{display:flex;gap:2px;align-items:center;font-size:16px;color:var(--dim)}.tg img.off{opacity:.18}.gate .ds{font-size:19px;color:var(--dim);margin:2px 0 8px}

.rc{font-size:23px;margin:10px 0;max-width:400px}.rc div{display:flex;align-items:baseline}.rc i{flex:1;border-bottom:3px dotted #4a6a74;margin:0 8px 5px}.rc b{font-weight:400;color:var(--gold)}

.perks span.r1{box-shadow:inset 0 0 0 2px #59d8ff}.perks span.r2{box-shadow:inset 0 0 0 2px #d38cff}.perks img{width:28px;height:28px}.perks u{position:absolute;right:1px;bottom:-2px;font-size:16px;text-decoration:none;color:#fff;text-shadow:1px 1px 0 #000}

.cols{display:flex;gap:24px;flex-wrap:wrap}.cols>div{flex:1;min-width:220px}
